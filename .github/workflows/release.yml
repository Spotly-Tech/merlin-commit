name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

jobs:
    release:
        name: publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - run: npm ci --ignore-scripts

            - run: npm run lint

            - run: npm run type-check

            - run: npm test

            - run: npm run build

            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
